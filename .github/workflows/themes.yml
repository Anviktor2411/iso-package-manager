name: Themes

on:
  pull_request:
    paths: ["themes/**", "ipm_themes.py", "tools/**", "theme-pack.schema.json"]
  push:
    branches: [main]
    paths: ["themes/**", "ipm_themes.py", "tools/**", "theme-pack.schema.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every theme pack
        run: python tools/ipmtheme.py validate themes/ --strict
      - name: Theme tests
        run: python tests/test_ipm_themes.py
      - name: Rebuild the gallery index
        run: python scripts/build_theme_index.py
      - name: Commit the index (main branch only)
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- docs/shop/index.json; then echo "index unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shop/index.json
          git commit -m "Update theme gallery index"
          git push
