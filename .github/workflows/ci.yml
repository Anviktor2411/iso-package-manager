name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 certifi

      - name: Syntax and undefined-name check
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics

      - name: CLI smoke test
        run: |
          python ipm_cli.py --help
          python ipm_cli.py list

      - name: GUI smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          xvfb-run -a python -c "import main; app = main.App(); app.update(); app.destroy(); print('GUI OK')"

      - name: GUI smoke test (Windows)
        if: runner.os == 'Windows'
        run: python -c "import main; app = main.App(); app.update(); app.destroy(); print('GUI OK')"
